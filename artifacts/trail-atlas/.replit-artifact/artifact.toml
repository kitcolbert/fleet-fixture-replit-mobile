kind = "mobile"
previewPath = "/"
title = "Trail Atlas"
description = "A mobile hiking guide for discovering fictional trails, comparing distance and difficulty, and viewing detailed trail information."
version = "1.0.0"
id = "artifacts/trail-atlas"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21180

[services.development]
run = "pnpm --filter @workspace/trail-atlas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trail-atlas", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/trail-atlas", "run", "serve" ]

[services.env]
PORT = "21180"
BASE_PATH = "/"
